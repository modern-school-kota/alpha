<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard · Applications | Modern School Kota</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #eef2f7;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }
        .dashboard-header {
            background: #002b5e;
            color: white;
            padding: 1.2rem 0;
            border-bottom: 5px solid #d4af37;
            margin-bottom: 30px;
        }
        .stat-card {
            background: white;
            border-radius: 16px;
            border: none;
            box-shadow: 0 6px 18px rgba(0,43,94,0.08);
            transition: 0.2s;
            padding: 1.2rem;
        }
        .stat-card:hover {
            box-shadow: 0 12px 24px rgba(0,43,94,0.12);
        }
        .stat-icon {
            font-size: 2.8rem;
            color: #002b5e;
            opacity: 0.2;
        }
        .filter-section {
            background: white;
            border-radius: 24px;
            padding: 1.5rem 1.8rem;
            box-shadow: 0 8px 20px rgba(0,0,0,0.02);
            border: 1px solid rgba(0,43,94,0.1);
            margin-bottom: 25px;
        }
        .app-table {
            background: white;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 15px 30px rgba(0,43,94,0.06);
            border: none;
        }
        .table thead th {
            background-color: #f8faff;
            color: #002b5e;
            font-weight: 700;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom-width: 2px;
            border-bottom-color: #d4af37;
            padding: 1rem 0.8rem;
        }
        .table td {
            vertical-align: middle;
            padding: 0.9rem 0.8rem;
            color: #1e293b;
            font-weight: 500;
        }
        .badge-app {
            background: #d4af37;
            color: #002b5e;
            font-weight: 700;
            padding: 0.5rem 1rem;
            border-radius: 40px;
            font-size: 0.75rem;
        }
        .badge-status {
            background: #e6f7e6;
            color: #1e7e34;
            font-weight: 600;
            border-radius: 40px;
            padding: 0.35rem 1rem;
        }
        .photo-thumb {
            width: 45px;
            height: 55px;
            object-fit: cover;
            object-position: top;
            border-radius: 8px;
            border: 2px solid #fff;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .photo-placeholder {
            width: 45px;
            height: 55px;
            background: #e9ecef;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #adb5bd;
            font-size: 1.4rem;
        }
        .footer-pagination {
            background: white;
            border-radius: 40px;
            padding: 0.9rem 1.5rem;
            margin-top: 25px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.02);
        }
        .btn-outline-secondary {
            border-color: #ced4da;
            color: #1e293b;
        }
        .btn-outline-secondary:hover {
            background-color: #f1f5f9;
            border-color: #002b5e;
        }
        .clear-filter {
            color: #002b5e;
            font-weight: 600;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .form-control, .form-select {
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            padding: 0.6rem 1rem;
        }
        .form-control:focus, .form-select:focus {
            border-color: #002b5e;
            box-shadow: 0 0 0 3px rgba(0,43,94,0.15);
        }
    </style>
</head>
<body>

<!-- header (similar to recruitment style) -->
<div class="dashboard-header">
    <div class="container d-flex align-items-center justify-content-between">
        <div class="d-flex align-items-center">
            <img src="ms_logo.png" alt="MS Kota" class="me-3" style="height: 58px; filter: brightness(0) invert(1);">
            <h3 class="fw-bold mb-0">Admin · Applications Dashboard</h3>
        </div>
        <span class="badge bg-white text-dark p-3 px-4 rounded-pill fw-bold"><i class="bi bi-calendar-check me-2"></i> 2026 cycle</span>
    </div>
</div>

<div class="container mb-5">

    <!-- stats cards -->
    <div class="row g-4 mb-4">
        <div class="col-md-3">
            <div class="stat-card d-flex align-items-center justify-content-between">
                <div>
                    <span class="text-uppercase small fw-bold text-secondary">Total apps</span>
                    <h2 class="fw-bold mt-2 mb-0">142</h2>
                </div>
                <i class="bi bi-file-text stat-icon"></i>
            </div>
        </div>
        <div class="col-md-3">
            <div class="stat-card d-flex align-items-center justify-content-between">
                <div>
                    <span class="text-uppercase small fw-bold text-secondary">PGT</span>
                    <h2 class="fw-bold mt-2 mb-0">48</h2>
                </div>
                <i class="bi bi-mortarboard stat-icon"></i>
            </div>
        </div>
        <div class="col-md-3">
            <div class="stat-card d-flex align-items-center justify-content-between">
                <div>
                    <span class="text-uppercase small fw-bold text-secondary">TGT / PRT</span>
                    <h2 class="fw-bold mt-2 mb-0">73</h2>
                </div>
                <i class="bi bi-people stat-icon"></i>
            </div>
        </div>
        <div class="col-md-3">
            <div class="stat-card d-flex align-items-center justify-content-between">
                <div>
                    <span class="text-uppercase small fw-bold text-secondary">New today</span>
                    <h2 class="fw-bold mt-2 mb-0">8</h2>
                </div>
                <i class="bi bi-star stat-icon"></i>
            </div>
        </div>
    </div>

    <!-- filter section (smart filter) -->
    <div class="filter-section">
        <div class="row g-3 align-items-end">
            <div class="col-md-3">
                <label class="form-label fw-bold small text-secondary">SEARCH</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-2 border-end-0"><i class="bi bi-search"></i></span>
                    <input type="text" class="form-control border-2 border-start-0 ps-0" id="searchInput" placeholder="Name, email, app no...">
                </div>
            </div>
            <div class="col-md-2">
                <label class="form-label fw-bold small text-secondary">POSITION</label>
                <select class="form-select" id="filterPosition">
                    <option value="all">All positions</option>
                    <option value="PGT">PGT</option>
                    <option value="TGT">TGT</option>
                    <option value="PRT">PRT</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <div class="col-md-2">
                <label class="form-label fw-bold small text-secondary">SUBJECT</label>
                <input type="text" class="form-control" id="filterSubject" placeholder="e.g. English">
            </div>
            <div class="col-md-2">
                <label class="form-label fw-bold small text-secondary">EXPERIENCE</label>
                <select class="form-select" id="filterExp">
                    <option value="all">Any</option>
                    <option value="0-2">0–2 years</option>
                    <option value="3-5">3–5 years</option>
                    <option value="6+">6+ years</option>
                </select>
            </div>
            <div class="col-md-3 d-flex justify-content-between align-items-center">
                <button class="btn btn-primary px-4 py-2 fw-bold" style="background-color: #002b5e; border: none;" id="applyFilterBtn"><i class="bi bi-funnel me-2"></i>Apply filter</button>
                <a href="#" class="clear-filter ms-3" id="clearFilters"><i class="bi bi-arrow-counterclockwise"></i> clear</a>
            </div>
        </div>
    </div>

    <!-- applications table (mock data with filler applications) -->
    <div class="app-table">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0" id="applicationTable">
                <thead>
                    <tr>
                        <th>Photo</th>
                        <th>App No / Name</th>
                        <th>Position</th>
                        <th>Subject / Dept</th>
                        <th>Experience</th>
                        <th>Applied on</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- injected via js -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- pagination / footer -->
    <div class="footer-pagination d-flex align-items-center justify-content-between">
        <div class="text-secondary fw-medium"><span id="showingCount">showing 8 of 12</span> applications</div>
        <div>
            <button class="btn btn-outline-secondary btn-sm me-2" disabled><i class="bi bi-chevron-left"></i></button>
            <span class="fw-bold mx-2">1</span>
            <button class="btn btn-outline-secondary btn-sm"><i class="bi bi-chevron-right"></i></button>
        </div>
    </div>
</div>

<script>
    (function() {
        // ------------- MOCK DATA (12 sample applications) ------------
        const applications = [
            { id: 'MSK-241201', name: 'Ananya Sharma', pos: 'PGT', subject: 'Chemistry', expYears: 7, photo: null, date: '2026-02-19', status: 'pending' },
            { id: 'MSK-241202', name: 'Rohit Mehta', pos: 'TGT', subject: 'Mathematics', expYears: 4, photo: null, date: '2026-02-18', status: 'reviewed' },
            { id: 'MSK-241203', name: 'Priya Singh', pos: 'PRT', subject: 'English', expYears: 2, photo: null, date: '2026-02-17', status: 'shortlisted' },
            { id: 'MSK-241204', name: 'Vikram Joshi', pos: 'PGT', subject: 'Physics', expYears: 9, photo: null, date: '2026-02-19', status: 'pending' },
            { id: 'MSK-241205', name: 'Sneha Kapoor', pos: 'Other', subject: 'Front Office', expYears: 3, photo: null, date: '2026-02-16', status: 'rejected' },
            { id: 'MSK-241206', name: 'Arjun Nair', pos: 'TGT', subject: 'Social Science', expYears: 5, photo: null, date: '2026-02-15', status: 'pending' },
            { id: 'MSK-241207', name: 'Neha Gupta', pos: 'PGT', subject: 'Economics', expYears: 8, photo: null, date: '2026-02-14', status: 'shortlisted' },
            { id: 'MSK-241208', name: 'Kavita Desai', pos: 'PRT', subject: 'Hindi', expYears: 1, photo: null, date: '2026-02-20', status: 'pending' },
            { id: 'MSK-241209', name: 'Manoj Yadav', pos: 'Other', subject: 'Accounts', expYears: 6, photo: null, date: '2026-02-13', status: 'reviewed' },
            { id: 'MSK-241210', name: 'Divya Menon', pos: 'TGT', subject: 'Science', expYears: 4, photo: null, date: '2026-02-12', status: 'pending' },
            { id: 'MSK-241211', name: 'Farhan Ali', pos: 'PGT', subject: 'Mathematics', expYears: 11, photo: null, date: '2026-02-20', status: 'pending' },
            { id: 'MSK-241212', name: 'Simran Kaur', pos: 'PRT', subject: 'English', expYears: 2, photo: null, date: '2026-02-11', status: 'rejected' }
        ];

        // helper to generate row html
        function renderRows(dataArray) {
            let html = '';
            dataArray.forEach(app => {
                // photo placeholder (mimic top face area)
                const photoHtml = app.photo 
                    ? `<img src="${app.photo}" alt="photo" class="photo-thumb">` 
                    : `<div class="photo-placeholder"><i class="bi bi-person-bounding-box"></i></div>`;

                // status badge style
                let statusClass = 'badge-status';
                let statusText = app.status.charAt(0).toUpperCase() + app.status.slice(1);
                if (app.status === 'pending') statusClass += ' bg-light text-dark';
                else if (app.status === 'reviewed') statusClass += ' bg-info bg-opacity-10 text-info-emphasis';
                else if (app.status === 'shortlisted') statusClass += ' bg-success bg-opacity-10 text-success';
                else if (app.status === 'rejected') statusClass += ' bg-danger bg-opacity-10 text-danger';

                const expDisplay = app.expYears + (app.expYears > 1 ? ' yrs' : ' yr');

                html += `<tr>
                    <td>${photoHtml}</td>
                    <td>
                        <div class="fw-bold">${app.id}</div>
                        <small class="text-secondary">${app.name}</small>
                    </td>
                    <td><span class="badge-app">${app.pos}</span></td>
                    <td>${app.subject}</td>
                    <td>${expDisplay}</td>
                    <td>${app.date}</td>
                    <td><span class="${statusClass}">${statusText}</span></td>
                    <td>
                        <button class="btn btn-sm btn-outline-dark rounded-pill px-3" style="border-width: 2px;" onclick="alert('View details for ${app.id}')">
                            <i class="bi bi-eye me-1"></i> view
                        </button>
                    </td>
                </tr>`;
            });
            return html;
        }

        const tbody = document.getElementById('tableBody');
        const showingSpan = document.getElementById('showingCount');

        function updateTable(filtered) {
            tbody.innerHTML = renderRows(filtered);
            showingSpan.innerText = `showing ${filtered.length} of ${applications.length}`;
        }

        // filter logic
        function filterApplications() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
            const posFilter = document.getElementById('filterPosition').value;
            const subFilter = document.getElementById('filterSubject').value.toLowerCase().trim();
            const expFilter = document.getElementById('filterExp').value;

            const filtered = applications.filter(app => {
                // search (app no, name, email not present but use name + id)
                if (searchTerm !== '') {
                    const haystack = (app.id + app.name + app.subject).toLowerCase();
                    if (!haystack.includes(searchTerm)) return false;
                }
                // position
                if (posFilter !== 'all' && app.pos !== posFilter) return false;
                // subject (partial)
                if (subFilter !== '' && !app.subject.toLowerCase().includes(subFilter)) return false;
                // experience range
                if (expFilter !== 'all') {
                    if (expFilter === '0-2' && (app.expYears < 0 || app.expYears > 2)) return false;
                    if (expFilter === '3-5' && (app.expYears < 3 || app.expYears > 5)) return false;
                    if (expFilter === '6+' && app.expYears < 6) return false;
                }
                return true;
            });
            updateTable(filtered);
        }

        // attach listeners
        document.getElementById('applyFilterBtn').addEventListener('click', filterApplications);
        document.getElementById('clearFilters').addEventListener('click', function(e) {
            e.preventDefault();
            document.getElementById('searchInput').value = '';
            document.getElementById('filterPosition').value = 'all';
            document.getElementById('filterSubject').value = '';
            document.getElementById('filterExp').value = 'all';
            filterApplications(); // reset to full list
        });

        // initial render (all applications)
        updateTable(applications);

        // additional: pressing Enter in search triggers filter
        document.getElementById('searchInput').addEventListener('keyup', function(e) {
            if (e.key === 'Enter') filterApplications();
        });

        // Optional: you could also real-time filter with debounce, but button is fine
        window.filterApplications = filterApplications; // for console debug
    })();
</script>

<!-- footer note (optional) -->
<div class="container text-center text-secondary small py-4">
    <i class="bi bi-shield-check me-1"></i> Modern School Kota — faculty recruitment dashboard (demo data)
</div>

<!-- bootstrap JS (optional for some interactions) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
