<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact Us | Modern School Talwandi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --maroon-deep: #4A0013;
      --maroon-primary: #7A0022;
      --maroon-light: #9E1B32;
      --cream-bg: #FAF6F0;
      --cream-card: rgba(253, 251, 247, 0.95);
      --cream-border: #E4D5C1;
      --gold-accent: #C5A059;
      --text-dark: #231B15;
      --text-muted: #6B5D52;
      --shadow-elevation: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 3rem 1.5rem;
      position: relative;
      overflow-x: hidden;
      background-color: var(--maroon-deep);
    }

    /* Background Image Slideshow */
    .bg-slideshow {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      opacity: 0;
      transition: opacity 1.8s ease-in-out, transform 6s ease-out;
      transform: scale(1.05);
    }

    .slide.active {
      opacity: 1;
      transform: scale(1);
    }

    /* Dark Maroon Overlay */
    .bg-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        135deg, 
        rgba(74, 0, 19, 0.78) 0%, 
        rgba(35, 27, 21, 0.85) 100%
      );
      z-index: 2;
    }

    /* Main Container Wrapper */
    .wrapper {
      position: relative;
      z-index: 3;
      width: 100%;
      max-width: 1100px;
    }

    /* Borderless Logo Above / Outside Card */
    .outer-logo-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .borderless-logo {
      max-width: 180px;
      max-height: 90px;
      object-fit: contain;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.3));
    }

    .logo-fallback-text {
      color: var(--cream-bg);
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }

    /* Glassmorphic Container Card */
    .container {
      display: flex;
      background: var(--cream-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: var(--shadow-elevation);
      border: 1px solid rgba(255, 255, 255, 0.5);
      min-height: 580px;
    }

    /* Left Side: Map Section */
    .map-section {
      flex: 1.1;
      position: relative;
      background-color: rgba(228, 213, 193, 0.3);
      display: flex;
      flex-direction: column;
    }

    .map-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 380px;
    }

    .map-wrapper iframe {
      width: 100%;
      height: 100%;
      border: 0;
      filter: contrast(1.02) saturate(1.05);
    }

    .map-overlay-info {
      position: absolute;
      bottom: 1.5rem;
      left: 1.5rem;
      right: 1.5rem;
      background: rgba(253, 251, 247, 0.92);
      backdrop-filter: blur(10px);
      padding: 1.25rem 1.5rem;
      border-radius: 16px;
      border: 1px solid var(--cream-border);
      box-shadow: 0 10px 25px rgba(0,0,0,0.12);
      display: flex;
      align-items: flex-start;
      gap: 1rem;
    }

    .location-icon {
      width: 42px;
      height: 42px;
      background-color: var(--maroon-primary);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      flex-shrink: 0;
    }

    .location-details h4 {
      color: var(--maroon-deep);
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 0.2rem;
    }

    .location-details p {
      color: var(--text-muted);
      font-size: 0.85rem;
      line-height: 1.35;
    }

    .coords-tag {
      display: inline-block;
      margin-top: 0.3rem;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--maroon-primary);
    }

    /* Right Side: Form Section */
    .form-section {
      flex: 1;
      padding: 3rem 2.5rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .form-header {
      margin-bottom: 1.75rem;
    }

    .form-header h1 {
      font-family: 'Playfair Display', serif;
      color: var(--maroon-deep);
      font-size: 2.1rem;
      margin-bottom: 0.35rem;
    }

    .form-header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .form-group {
      margin-bottom: 1.25rem;
      position: relative;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.4rem;
      font-weight: 600;
      font-size: 0.85rem;
      color: var(--maroon-deep);
    }

    .required-star {
      color: #C62828;
      font-weight: bold;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 1rem;
      color: var(--text-muted);
      transition: color 0.25s ease;
      pointer-events: none;
    }

    .form-group input {
      width: 100%;
      padding: 0.85rem 1rem 0.85rem 2.8rem;
      border: 1.5px solid var(--cream-border);
      border-radius: 10px;
      background-color: #FFFFFF;
      color: var(--text-dark);
      font-size: 0.95rem;
      transition: all 0.25s ease;
      outline: none;
    }

    .form-group input::placeholder {
      color: #A3968A;
    }

    .form-group input:focus {
      border-color: var(--maroon-primary);
      box-shadow: 0 0 0 4px rgba(122, 0, 34, 0.1);
    }

    .form-group input:focus + .input-icon {
      color: var(--maroon-primary);
    }

    /* Validated Field Indicator */
    .form-group.valid input {
      border-color: #2E7D32;
    }

    .submit-btn {
      width: 100%;
      padding: 1.1rem;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--maroon-primary), var(--maroon-deep));
      color: #ffffff;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      margin-top: 1rem;
      box-shadow: 0 8px 20px rgba(122, 0, 34, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .submit-btn:hover:not(:disabled) {
      background: linear-gradient(135deg, var(--maroon-light), var(--maroon-primary));
      transform: translateY(-2px);
      box-shadow: 0 12px 25px rgba(122, 0, 34, 0.4);
    }

    .submit-btn:disabled {
      background: #D8CEC4;
      color: #8C8075;
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
      opacity: 0.85;
    }

    .status-note {
      margin-top: 1.25rem;
      font-size: 0.825rem;
      text-align: center;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* Responsive Layout */
    @media (max-width: 960px) {
      .container {
        flex-direction: column;
        min-height: auto;
      }

      .map-section {
        height: 380px;
      }

      .form-section {
        padding: 2.5rem 2rem;
      }
    }

    @media (max-width: 480px) {
      .form-header h1 {
        font-size: 1.85rem;
      }
      .form-section {
        padding: 2rem 1.5rem;
      }
      .map-overlay-info {
        bottom: 1rem;
        left: 1rem;
        right: 1rem;
        padding: 1rem;
      }
      .borderless-logo {
        max-width: 140px;
      }
    }
  </style>
</head>
<body>

  <!-- Animated Background Image Slideshow -->
  <div class="bg-slideshow">
    <div class="slide active" style="background-image: url('https://images.unsplash.com/photo-1523050854058-8df90110c9f1?q=80&w=1600&auto=format&fit=crop');"></div>
    <div class="slide" style="background-image: url('https://images.unsplash.com/photo-1580582932707-520aed937b7b?q=80&w=1600&auto=format&fit=crop');"></div>
    <div class="slide" style="background-image: url('https://images.unsplash.com/photo-1509062522246-3755977927d7?q=80&w=1600&auto=format&fit=crop');"></div>
    <div class="slide" style="background-image: url('https://images.unsplash.com/photo-1541829070764-84a7d30dd3f3?q=80&w=1600&auto=format&fit=crop');"></div>
  </div>
  <div class="bg-overlay"></div>

  <!-- Main Content Wrapper -->
  <div class="wrapper">
    
    <!-- Outer Borderless Logo Slot -->
    <div class="outer-logo-wrapper">
      <img src="logo.png" alt="Modern School Kota" class="borderless-logo" onerror="this.onerror=null; this.parentNode.innerHTML='<span class=\'logo-fallback-text\'>Modern School Kota</span>';">
    </div>

    <div class="container">
      <!-- Left Side: Interactive Map -->
      <div class="map-section">
        <div class="map-wrapper">
          <iframe 
            src="https://maps.google.com/maps?q=25.1387,75.8360&hl=en&z=17&output=embed" 
            allowfullscreen="" 
            loading="lazy" 
            referrerpolicy="no-referrer-when-downgrade">
          </iframe>
        </div>

        <div class="map-overlay-info">
          <div class="location-icon">
            <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
            </svg>
          </div>
          <div class="location-details">
            <h4>Modern School</h4>
            <p>Sector-A, Talwandi, Kota, Rajasthan 324005</p>
            <span class="coords-tag">Lat: 25.1387° N | Lon: 75.8360° E</span>
          </div>
        </div>
      </div>

      <!-- Right Side: Contact Form -->
      <div class="form-section">
        <div class="form-header">
          <h1>Contact Us</h1>
          <p>Complete all mandatory fields (*) to submit your message.</p>
        </div>

        <form id="contactForm" autocomplete="off">
          <div class="form-group" id="group-fullName">
            <label for="fullName">Your Name <span class="required-star">*</span></label>
            <div class="input-wrapper">
              <input type="text" id="fullName" placeholder="e.g. Rahul Sharma" required>
              <svg class="input-icon" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
              </svg>
            </div>
          </div>

          <div class="form-group" id="group-contactNumber">
            <label for="contactNumber">Contact Number <span class="required-star">*</span></label>
            <div class="input-wrapper">
              <input type="tel" id="contactNumber" placeholder="+91 98765 43210" required>
              <svg class="input-icon" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
              </svg>
            </div>
          </div>

          <div class="form-group" id="group-email">
            <label for="email">E-Mail <span class="required-star">*</span></label>
            <div class="input-wrapper">
              <input type="email" id="email" placeholder="name@example.com" required>
              <svg class="input-icon" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
              </svg>
            </div>
          </div>

          <div class="form-group" id="group-subject">
            <label for="subject">Subject <span class="required-star">*</span></label>
            <div class="input-wrapper">
              <input type="text" id="subject" placeholder="e.g. Admission Query" required>
              <svg class="input-icon" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M7 8h10M7 12h4m1 8l-4-4H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-3l-4 4z"/>
              </svg>
            </div>
          </div>

          <button type="submit" id="submitBtn" class="submit-btn" disabled>
            <span>Submit Message</span>
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
            </svg>
          </button>

          <p id="statusNote" class="status-note">Please complete all required (*) fields to submit.</p>
        </form>
      </div>
    </div>
  </div>

  <script>
    /* Background Image Transition Slideshow */
    const slides = document.querySelectorAll('.bg-slideshow .slide');
    let currentSlide = 0;

    function nextSlide() {
      slides[currentSlide].classList.remove('active');
      currentSlide = (currentSlide + 1) % slides.length;
      slides[currentSlide].classList.add('active');
    }
    setInterval(nextSlide, 4000);

    /* Form Validation Logic */
    const form = document.getElementById('contactForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusNote = document.getElementById('statusNote');
    const inputs = form.querySelectorAll('input');

    function validateEmail(email) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    }

    function checkFormState() {
      let allFilled = true;

      inputs.forEach(input => {
        const value = input.value.trim();
        const group = input.closest('.form-group');

        if (value === '') {
          allFilled = false;
          group.classList.remove('valid');
        } else {
          if (input.type === 'email' && !validateEmail(value)) {
            allFilled = false;
            group.classList.remove('valid');
          } else {
            group.classList.add('valid');
          }
        }
      });

      if (allFilled) {
        submitBtn.disabled = false;
        statusNote.style.color = '#2E7D32';
        statusNote.textContent = '✓ All details filled. Ready to submit!';
      } else {
        submitBtn.disabled = true;
        statusNote.style.color = 'var(--text-muted)';
        statusNote.textContent = 'Please complete all required (*) fields to enable submission.';
      }
    }

    inputs.forEach(input => {
      input.addEventListener('input', checkFormState);
      input.addEventListener('change', checkFormState);
      input.addEventListener('blur', checkFormState);
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      
      submitBtn.disabled = true;
      submitBtn.querySelector('span').textContent = 'Sending Message...';
      
      setTimeout(() => {
        alert('Thank you! Your message has been sent to Modern School Talwandi.');
        form.reset();
        inputs.forEach(input => input.closest('.form-group').classList.remove('valid'));
        submitBtn.querySelector('span').textContent = 'Submit Message';
        checkFormState();
      }, 800);
    });
  </script>

</body>
</html>
