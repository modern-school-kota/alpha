<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ATC Verification | Modern School Kota</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      /* Updated Color Palette to Slate/Navy Theme */
      --primary-deep: #16242f;
      --primary-main: #263d4f;
      --primary-light: #38556d;
      --cream-bg: #FDFBF7;
      --cream-card: rgba(253, 251, 247, 0.95);
      --cream-border: #D3CFC7;
      --text-dark: #16242f;
      --text-muted: #4a5963;
      --shadow-elevation: 0 25px 50px -12px rgba(18, 30, 40, 0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 3rem 1.5rem;
      position: relative;
      overflow-x: hidden;
      background: linear-gradient(135deg, #263d4f 0%, #16242f 100%);
    }

    /* Main Container Wrapper */
    .wrapper {
      position: relative;
      z-index: 3;
      width: 100%;
      max-width: 520px;
    }

    /* Borderless Logo Above / Outside Card */
    .outer-logo-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .borderless-logo {
      max-width: 220px; /* Increased logo width */
      max-height: 100px;
      object-fit: contain;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.4));
    }

    .logo-fallback-text {
      color: var(--cream-bg);
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }

    /* Glassmorphic Card Container */
    .form-card {
      background: var(--cream-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 24px;
      padding: 3rem 2.5rem;
      box-shadow: var(--shadow-elevation);
      border: 1px solid rgba(253, 251, 247, 0.3);
    }

    /* Form Header Section */
    .header-section {
      text-align: center;
      margin-bottom: 2rem;
    }

    .header-section h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      color: var(--primary-main);
      margin-bottom: 0.35rem;
    }

    .header-section p {
      color: var(--text-muted);
      font-size: 0.925rem;
    }

    /* Form Controls */
    .form-group {
      margin-bottom: 1.25rem;
      position: relative;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.4rem;
      font-weight: 600;
      font-size: 0.85rem;
      color: var(--primary-main);
    }

    .required-star {
      color: #C62828;
      font-weight: bold;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 1rem;
      color: var(--text-muted);
      transition: color 0.25s ease;
      pointer-events: none;
    }

    .form-group input {
      width: 100%;
      padding: 0.85rem 1rem 0.85rem 2.8rem;
      border: 1.5px solid var(--cream-border);
      border-radius: 10px;
      background-color: #FFFFFF;
      color: var(--text-dark);
      font-size: 0.95rem;
      transition: all 0.25s ease;
      outline: none;
    }

    .form-group input::placeholder {
      color: #A0A8B8;
    }

    .form-group input:focus {
      border-color: var(--primary-main);
      box-shadow: 0 0 0 4px rgba(38, 61, 79, 0.15);
    }

    .form-group input:focus + .input-icon {
      color: var(--primary-main);
    }

    /* Validated Field Indicator */
    .form-group.valid input {
      border-color: #2E7D32;
    }

    .submit-btn {
      width: 100%;
      padding: 1.1rem;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--primary-main), var(--primary-deep));
      color: #ffffff;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      margin-top: 1.25rem;
      box-shadow: 0 8px 20px rgba(38, 61, 79, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .submit-btn:hover:not(:disabled) {
      background: linear-gradient(135deg, var(--primary-light), var(--primary-main));
      transform: translateY(-2px);
      box-shadow: 0 12px 25px rgba(38, 61, 79, 0.35);
    }

    .submit-btn:disabled {
      background: var(--cream-border);
      color: var(--text-muted);
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
      opacity: 0.85;
    }

    .status-note {
      margin-top: 1.25rem;
      font-size: 0.825rem;
      text-align: center;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* Responsive Breakdown */
    @media (max-width: 480px) {
      .form-card {
        padding: 2rem 1.5rem;
      }
      .header-section h1 {
        font-size: 1.75rem;
      }
      .borderless-logo {
        max-width: 160px;
      }
    }
  </style>
</head>
<body>

  <!-- Main Content Wrapper -->
  <div class="wrapper">
    
    <!-- Outer Borderless Logo Slot: using 'main_logo.png' -->
    <div class="outer-logo-wrapper">
      <img src="main_logo.png" alt="Modern School Kota" class="borderless-logo" onerror="this.onerror=null; this.parentNode.innerHTML='<span class=\'logo-fallback-text\'>Modern School Kota</span>';">
    </div>

    <!-- Form Container Card -->
    <div class="form-card">
      
      <div class="header-section">
        <h1>TC Verification</h1>
        <p>Enter the student details below to verify the Transfer Certificate.</p>
      </div>

      <form id="atcVerificationForm" autocomplete="off">
        
        <!-- Admission Number Input -->
        <div class="form-group" id="group-admissionNo">
          <label for="admissionNo">Admission Number <span class="required-star">*</span></label>
          <div class="input-wrapper">
            <input type="text" id="admissionNo" placeholder="e.g. MSK-2024-1082" required>
            <svg class="input-icon" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M10 6H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V8a2 2 0 00-2-2h-5m-4 0V5a2 2 0 012-2h2a2 2 0 012 2v1m-6 0h6"/>
            </svg>
          </div>
        </div>

        <!-- Date of Birth Input -->
        <div class="form-group" id="group-dob">
          <label for="dob">Date of Birth <span class="required-star">*</span></label>
          <div class="input-wrapper">
            <input type="date" id="dob" required>
            <svg class="input-icon" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
            </svg>
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="submitBtn" class="submit-btn" disabled>
          <span>Verify Certificate</span>
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
        </button>

        <p id="statusNote" class="status-note">Please enter both Admission No. and Date of Birth.</p>
      </form>

    </div>
  </div>

  <script>
    /* Form Field Validation */
    const form = document.getElementById('atcVerificationForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusNote = document.getElementById('statusNote');
    const inputs = form.querySelectorAll('input');

    function checkFormState() {
      let allValid = true;

      inputs.forEach(input => {
        const value = input.value.trim();
        const group = input.closest('.form-group');

        if (value === '') {
          allValid = false;
          group.classList.remove('valid');
        } else {
          group.classList.add('valid');
        }
      });

      if (allValid) {
        submitBtn.disabled = false;
        statusNote.style.color = '#2E7D32';
        statusNote.textContent = '✓ Ready to verify details.';
      } else {
        submitBtn.disabled = true;
        statusNote.style.color = 'var(--text-muted)';
        statusNote.textContent = 'Please enter both Admission No. and Date of Birth to enable verification.';
      }
    }

    inputs.forEach(input => {
      input.addEventListener('input', checkFormState);
      input.addEventListener('change', checkFormState);
      input.addEventListener('blur', checkFormState);
    });

    /* Form Submit Handling */
    form.addEventListener('submit', (e) => {
      e.preventDefault();

      const admissionNo = document.getElementById('admissionNo').value.trim();
      const dob = document.getElementById('dob').value;

      submitBtn.disabled = true;
      submitBtn.querySelector('span').textContent = 'Verifying Record...';

      setTimeout(() => {
        alert(`Verification Request Submitted!\nAdmission No: ${admissionNo}\nDOB: ${dob}`);
        
        submitBtn.querySelector('span').textContent = 'Verify Certificate';
        checkFormState();
      }, 1000);
    });
  </script>

</body>
</html>
